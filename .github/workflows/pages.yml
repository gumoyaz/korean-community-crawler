# 커트 — 크롤링 + 정적 사이트 빌드 + GitHub Pages 배포
# cron-job.org가 약 10분마다 workflow_dispatch로 호출하고, schedule은 백업이다.
# 두 트리거가 겹쳐도 build.py의 간격 가드(MIN_INTERVAL_MIN)가 중복 크롤을 막는다.
name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: '간격 가드를 무시하고 크롤링'
        type: boolean
        default: false
  schedule:
    # 정각(:00)은 GitHub 스케줄러 고부하 시간이라 지연·누락될 수 있어 피한다
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/daily/**'

# 권한은 잡마다 필요한 것만 준다
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 최악 경로(수집 180초 + AI 요약 130초 + 데일리 약 250초 + 설치·렌더)가 10분을 넘을 수 있다.
    # 음성(TTS 최대 150초 × 2모델)은 데일리 생성을 시도한 실행(성공·실패 모두)과 build.py 시작 후
    # 7분(TTS_START_BUDGET_SEC)이 지난 실행에서는 하지 않으므로 이 경로와 겹치지 않는다
    timeout-minutes: 15
    permissions:
      contents: write   # 데일리 리포트(data/daily/) 커밋, audio 브랜치 push
    outputs:
      skip: ${{ steps.build.outputs.skip }}
      daily_created: ${{ steps.build.outputs.daily_created }}
      # 수집 상태(크롤한 실행만, build.py _health). health: ok|degraded|stale, health_streak: 알림 대상 문제가 이어진 횟수
      # (아니면 0), health_alert: 그 횟수가 3번 이상(KST 00~06시 판정을 쉬며 직전 상태를 이어 둔 실행은 false),
      # health_changed: 알림 대상(상태·문제 커뮤니티 목록)이 직전 크롤과 다름, health_notify: 열린 이슈에 코멘트할 실행
      # (알림 중 + 바뀜 또는 그 장애의 첫 알림), health_close: 열린 이슈를 닫을 실행(알림 중이던 문제가 없어진 뒤 3번)
      health: ${{ steps.build.outputs.health }}
      health_detail: ${{ steps.build.outputs.health_detail }}
      health_streak: ${{ steps.build.outputs.health_streak }}
      health_alert: ${{ steps.build.outputs.health_alert }}
      health_changed: ${{ steps.build.outputs.health_changed }}
      health_notify: ${{ steps.build.outputs.health_notify }}
      health_close: ${{ steps.build.outputs.health_close }}
    steps:
      # 이벤트 시점 SHA가 아니라 잡이 시작될 때의 브랜치 끝을 받는다.
      # concurrency로 대기하던 실행도 직전 실행이 커밋한 데일리 리포트를 봐야 중복 생성하지 않는다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      # audio 브랜치(음성 스냅숏, 커밋 1개)를 .audio/ 로. 실패하면 TTS·publish를 끈다
      # (빈 .audio/ 로 생성·push하면 기존 음성이 지워지므로). 렌더링은 .audio/에 있는 것만 싣는다
      - name: Fetch audio
        id: audio
        continue-on-error: true
        run: |
          mkdir -p .audio
          # 전체 ref 이름으로 찾는다('--heads origin audio'는 이름 끝 일치라 feature/audio 같은 브랜치도 잡힌다)
          if git ls-remote --exit-code origin refs/heads/audio >/dev/null; then
            git fetch --depth=1 --no-tags origin +refs/heads/audio:refs/remotes/origin/audio
            git archive refs/remotes/origin/audio | tar -x -C .audio
            echo "base=$(git rev-parse refs/remotes/origin/audio)" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" -eq 2 ] || exit "$rc"   # 2 = 브랜치 없음(첫 실행)
            echo "base=" >> "$GITHUB_OUTPUT"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 음성 MP3 인코더(선택 의존성). 휠만 받고(소스 빌드 안 함), 실패해도 크롤·배포는 계속한다
      # — 없으면 tts.py가 TTS 호출 전에 encode_failed로 멈추고 페이지는 브라우저 음성으로 읽는다
      - name: Install audio encoder
        continue-on-error: true
        run: pip install --only-binary=lameenc lameenc==1.8.4

      # 직전 실행의 state.json. Pages CDN은 쿼리스트링을 무시하고 최대 10분 캐시하므로
      # 사이트의 data/state.json(STATE_URL)은 캐시가 없을 때만 쓴다. restore-keys는 가장 최근 캐시를 고른다.
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: .state/state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Crawl and build site
        id: build
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}   # 비우면 gemini.py 기본값, 'none'이면 끔
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}   # GA4 측정 ID(G-…). 비우면 분석 태그 없음
          # 데일리 음성(Gemini TTS): audio 브랜치를 받았고 코드 푸시(--no-crawl)가 아닐 때만 생성·정리
          TTS_ENABLED: ${{ steps.audio.outputs.ok == 'true' && github.event_name != 'push' }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}                     # 비우면 tts.py 기본값(gemini-3.8-flash-tts)
          TTS_FALLBACK_MODEL: ${{ vars.TTS_FALLBACK_MODEL }}   # 비우면 gemini-3.8-flash-lite-tts, 'none'이면 끔
          TTS_VOICE: ${{ vars.TTS_VOICE }}                     # 비우면 Kore
          FORCE_INPUT: ${{ inputs.force }}
          PYTHONUNBUFFERED: '1'
        run: |
          # 캐시 파일이 없거나 깨졌으면 build.py가 STATE_URL로 넘어간다
          args=(--state-file .state/state.json)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # 코드 푸시: 크롤 없이 이전 상태로 다시 렌더링만 해서 바로 배포
            args+=(--no-crawl)
          elif [ "$FORCE_INPUT" = "true" ]; then
            args+=(--force)
          fi
          python build.py "${args[@]}"

      - name: Keep state for next run
        if: steps.build.outputs.skip != 'true'
        run: |
          mkdir -p .state
          cp _site/data/state.json .state/state.json

      - name: Save state
        if: steps.build.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: .state/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true  # .nojekyll

      # 새 데일리 리포트(data/daily/*.json)만 커밋한다. 실패해도 배포는 진행(다음 실행이 다시 생성).
      # 다음 날 0시 이후에는 전날 리포트를 최종본으로 덮어쓰므로 이미 있는 파일도 커밋한다.
      - name: Commit daily report
        if: steps.build.outputs.daily_created == 'true'
        continue-on-error: true
        env:
          DAILY_DATE: ${{ steps.build.outputs.daily_date }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "daily: ${DAILY_DATE} 리포트"
          for attempt in 1 2; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 실패 (시도 $attempt)"
            sleep 5
          done
          exit 1

      # 음성 스냅숏을 부모 없는 커밋 1개로 교체(히스토리 안 쌓임). 실패해도 배포는 진행 — 다음 실행이 다시 만든다
      # fetch 이후 누가 audio 브랜치를 바꿨으면 --force-with-lease가 거부한다
      - name: Publish audio
        if: steps.audio.outputs.ok == 'true' && steps.build.outputs.audio_changed == 'true'
        continue-on-error: true
        env:
          AUDIO_BASE: ${{ steps.audio.outputs.base }}
          AUDIO_DATES: ${{ steps.build.outputs.audio_dates }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/audio-index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$PWD/.audio" add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "audio: ${AUDIO_DATES}")
          unset GIT_INDEX_FILE
          git push --force-with-lease="refs/heads/audio:${AUDIO_BASE}" origin "${commit}:refs/heads/audio"

  # 수집 이상 알림: 알림 대상 문제가 3번(build.py HEALTH_ALERT_STREAK) 연속이면 'source-health' 라벨 이슈를 연다.
  # 알림 대상 = stale·stale-source·partial, 또는 커뮤니티 missing·blocked·(이슈링크·직접 수집으로도 못 채우는) degraded.
  # 열린 뒤에는 상태가 바뀌었거나 새 장애의 첫 알림일 때만(health_notify) 코멘트하고, 알림 대상이 없어지면 닫는다.
  # 닫기는 알림 중이던 문제가 없어진 뒤 3번의 실행(health_close)에서 시도한다 — 한 번 실패해도 다음 실행이 닫는다.
  # KST 00~06시에는 크롤러가 갱신 멈춤을 판정하지 않으므로 이 시간의 '문제 없음'으로는 닫지 않는다(build.py _health).
  # GitHub가 이메일·앱 알림을 보낸다. 문제가 이어지는 동안(alert)이나 닫기 실행에만 돈다. 실패해도 배포와 무관하다
  health:
    needs: build
    if: >-
      needs.build.outputs.skip != 'true' && needs.build.outputs.health != '' &&
      (needs.build.outputs.health_alert == 'true' || needs.build.outputs.health_close == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write     # 이슈·라벨 만들기, 코멘트, 닫기
      contents: read
    steps:
      - name: Open, comment or close source-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH: ${{ needs.build.outputs.health }}
          HEALTH_DETAIL: ${{ needs.build.outputs.health_detail }}
          HEALTH_STREAK: ${{ needs.build.outputs.health_streak }}
          HEALTH_ALERT: ${{ needs.build.outputs.health_alert }}
          HEALTH_NOTIFY: ${{ needs.build.outputs.health_notify }}
          HEALTH_CLOSE: ${{ needs.build.outputs.health_close }}
        run: |
          set -euo pipefail
          label=source-health
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          stamp=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          body="$RUNNER_TEMP/health-body.md"
          gh label create "$label" --color D93F0B --description '크롤링 소스 수집 상태 알림 (자동)' 2>/dev/null || true
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          # 알림 대상이 없어짐 — health가 ok이거나, 남은 문제가 다른 경로로 채워지는 갱신 멈춤뿐.
          # 닫은 다음에 코멘트한다: 닫기가 실패하면 다음 닫기 실행이 다시 시도하고, 코멘트가 두 번 붙지 않는다
          if [ "$HEALTH_CLOSE" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --reason completed
              {
                printf '회복: 알림 대상 문제가 없어졌습니다 (수집 상태 %s, %s).\n\n' "$HEALTH" "$stamp"
                if [ "$HEALTH" != "ok" ]; then
                  printf '남은 표시(알림 대상 아님):\n'
                  printf '%s\n' "$HEALTH_DETAIL" | sed 's/ · /\n/g' | sed 's/^/- /'
                  printf '\n'
                fi
                printf '실행: %s\n' "$run_url"
              } > "$body"
              gh issue comment "$open" --body-file "$body"
            fi
            exit 0
          fi
          [ "$HEALTH_ALERT" = "true" ] || exit 0

          {
            printf '수집 상태: **%s** (연속 %s번, %s)\n\n' "$HEALTH" "$HEALTH_STREAK" "$stamp"
            # detail은 ' · '로 이은 한 줄 — 항목마다 줄을 나눈다
            printf '%s\n' "$HEALTH_DETAIL" | sed 's/ · /\n/g' | sed 's/^/- /'
            printf '\n커뮤니티별 표는 실행 요약(Step Summary)에 있습니다: %s\n' "$run_url"
          } > "$body"
          if [ -z "$open" ]; then
            gh issue create --title "수집 이상: $HEALTH ($stamp)" --label "$label" --body-file "$body"
          elif [ "$HEALTH_NOTIFY" = "true" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            echo "이슈 #$open 열려 있음 - 상태 그대로라 코멘트 생략"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # Pages 배포
      id-token: write   # 배포 출처 확인(OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
